# fork 开发包使用 debug 模式，不依赖原作者的发布私钥。
# Android 与正式包使用同一 Release 密钥，保持 debug 模式与既有启动校验。
name: Preview builds
on:
  push:
    branches: [main]
    # 文档或测试单独变化只跑 CI，避免无意义地重复三平台编译。
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.*'
      - 'tool/**'
      - '.github/workflows/preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.repository != 'OGL-Teams/OhGithubLost' && github.repository != 'yingo-server/OhGithubLost'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            target: apk
            os: ubuntu-latest
            artifact: build/app/outputs/flutter-apk/app-debug.apk
          - platform: windows
            target: windows
            os: windows-latest
            artifact: build/windows/x64/runner/Debug/**
          - platform: linux
            target: linux
            os: ubuntu-22.04
            artifact: build/linux/x64/debug/bundle/**
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: 安装 Linux 桌面依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev libstdc++-12-dev libglu1-mesa
      - name: 生成平台并注入规格
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          flutter create --platforms=${{ matrix.platform }} --org com.yingo --project-name ohgithublost .
          rm -f test/widget_test.dart
          OGL_PY=python3
          command -v python3 >/dev/null 2>&1 || OGL_PY=python
          "$OGL_PY" tool/inject_platform_spec.py --target ${{ matrix.platform }}
          flutter pub get
      - name: 还原固定 Android Release 签名（缺配置即失败）
        if: matrix.platform == 'android'
        env:
          OGL_ANDROID_KEYSTORE: ${{ secrets.OGL_ANDROID_KEYSTORE }}
          OGL_ANDROID_STORE_PASSWORD: ${{ secrets.OGL_ANDROID_STORE_PASSWORD }}
          OGL_ANDROID_KEY_PASSWORD: ${{ secrets.OGL_ANDROID_KEY_PASSWORD }}
          OGL_ANDROID_KEY_ALIAS: ${{ secrets.OGL_ANDROID_KEY_ALIAS }}
          OGL_ANDROID_CERT_SHA256: ${{ secrets.OGL_ANDROID_CERT_SHA256 }}
        run: python3 tool/android_signing.py prepare
      - name: 生成 Android 递增版本号
        if: matrix.platform == 'android'
        id: android_version
        run: python3 tool/android_signing.py version
      - name: 编译开发包
        run: >-
          flutter build ${{ matrix.target }} --debug
          ${{ steps.android_version.outputs.version_code && format('--build-number={0}', steps.android_version.outputs.version_code) || '' }}
      - name: apksigner 核验固定签名、包名及版本号
        if: matrix.platform == 'android'
        env:
          OGL_ANDROID_CERT_SHA256: ${{ secrets.OGL_ANDROID_CERT_SHA256 }}
        run: python3 tool/android_signing.py verify --version-code "${{ steps.android_version.outputs.version_code }}"
      - name: 上传 Android 签名核验报告
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: OGL-preview-android-signing
          path: build/android-signing-report.json
          if-no-files-found: error
          retention-days: 14
      - name: 清理 Android 签名私密文件
        if: always() && matrix.platform == 'android'
        run: python3 tool/android_signing.py cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: OGL-preview-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
